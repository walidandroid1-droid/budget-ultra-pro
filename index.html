<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Budget Ultra Pro V4 – Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
--bg:#0d1b2a;
--card:#1b263b;
--text:#e0e1dd;
--accent:#3d5a80;
--accent-light:#98c1d9;
--danger:#e63946;
}
body{
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont;
color:var(--text);
padding:10px;
}
.container{max-width:500px;margin:auto;}
.card{
background:var(--card);
border-radius:20px;
padding:15px;
margin-bottom:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.4);
}
button,input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:12px;
border:none;
font-size:14px;
}
button{background:var(--accent);color:white;font-weight:bold;}
button.danger{background:var(--danger);}
.progress{background:#274156;border-radius:10px;overflow:hidden;height:12px;}
.bar{background:var(--accent-light);height:100%;width:0%;}
small{font-size:12px;color:#98c1d9;}
select#filter{margin-bottom:10px;}
.widget{
display:flex;
justify-content:space-around;
flex-wrap:wrap;
background:#274156;
border-radius:15px;
padding:15px;
margin-bottom:15px;
color:#fff;
text-align:center;
}
.widget div{margin:5px 0; flex:1; min-width:120px;}
.widget h4{margin:0 0 5px 0;color:#98c1d9;}
.suggestions{
background:#274156;
border-radius:15px;
padding:10px;
margin-top:10px;
color:#fff;
}
.suggestions h4{
margin:0 0 5px 0;
color:#98c1d9;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h2>💎 Budget Ultra Pro V4</h2>
</div>

<!-- ✅ Widget résumé en haut -->
<div class="widget" id="widget">
<div>
<h4>💰 Solde</h4>
<span id="w_balance">0 DT</span>
</div>
<div>
<h4>🏦 Épargne</h4>
<span id="w_save">0 DT</span>
</div>
<div>
<h4>🎯 Objectif</h4>
<span id="w_goal">0 DT</span>
</div>
<div>
<h4>🕒 Dernière transaction</h4>
<span id="w_last">Aucune</span>
</div>
</div>

<div class="card" id="alert">Bienvenue 👋</div>

<div class="card">
<h3>🎯 Objectif d’épargne</h3>
<input type="number" id="goalInput" placeholder="Objectif (ex: 1000 DT)">
<button onclick="setGoal()">Définir objectif</button>
<div class="progress"><div class="bar" id="progress"></div></div>
<p id="goalText"></p>
</div>

<div class="card">
<select id="type">
<option value="income">Dépôt (Revenu)</option>
<option value="expense">Retrait (Dépense)</option>
<option value="save">Épargne</option>
</select>

<select id="category">
<option>Maison</option>
<option>Nourriture</option>
<option>Transport</option>
<option>Santé</option>
<option>Loisirs</option>
<option>Autre</option>
</select>

<input type="number" id="amount" placeholder="Montant">
<input type="text" id="note" placeholder="Note">
<button onclick="addTransaction()">Ajouter</button>
</div>

<div class="card">
<p>💰 Revenus: <b id="income">0</b></p>
<p>💸 Dépenses: <b id="expense">0</b></p>
<p>🏦 Épargne: <b id="save">0</b></p>
<p>📊 Solde: <b id="balance">0</b></p>
</div>

<div class="card">
<h3>📜 Historique</h3>
<label>Filtrer par catégorie :</label>
<select id="filter" onchange="display()">
<option value="all">Toutes</option>
<option>Maison</option>
<option>Nourriture</option>
<option>Transport</option>
<option>Santé</option>
<option>Loisirs</option>
<option>Autre</option>
</select>
<ul id="list"></ul>
</div>

<div class="card suggestions" id="suggestions">
<h4>💡 Suggestions intelligentes</h4>
<ul id="suggestionsList"></ul>
</div>

</div>

<script>
let data=JSON.parse(localStorage.getItem("budgetWidget"))||[];
let goal=localStorage.getItem("goal")||0;
let editingIndex=null;

function setGoal(){
goal=document.getElementById("goalInput").value;
localStorage.setItem("goal",goal);
display();
}

function addTransaction(){
let type=document.getElementById("type").value;
let category=document.getElementById("category").value;
let amount=parseFloat(document.getElementById("amount").value);
let note=document.getElementById("note").value;
if(!amount) return alert("Montant manquant");

let now=new Date();
let dateTime=now.toLocaleDateString("fr-FR")+" "+now.toLocaleTimeString("fr-FR");

if(editingIndex!==null){
  data[editingIndex]={type,category,amount,note,dateTime};
  editingIndex=null;
}else{
  data.push({type,category,amount,note,dateTime});
}

localStorage.setItem("budgetWidget",JSON.stringify(data));
clearInputs();
display();
}

function clearInputs(){
document.getElementById("amount").value="";
document.getElementById("note").value="";
}

function display(){
let income=0,expense=0,save=0;
let list=document.getElementById("list");
list.innerHTML="";

let filterCat=document.getElementById("filter").value;

data.forEach((d,i)=>{
if(d.type=="income") income+=d.amount;
if(d.type=="expense") expense+=d.amount;
if(d.type=="save") save+=d.amount;

if(filterCat=="all" || d.category==filterCat){
let li=document.createElement("li");
li.innerHTML=`<b>${d.category}</b> - ${d.amount} DT (${d.note}) <br>
<small>🕒 ${d.dateTime}</small><br>
<button onclick="editTransaction(${i})">Modifier</button>
<button class="danger" onclick="deleteTransaction(${i})">Supprimer</button>`;
list.appendChild(li);
}
});

document.getElementById("income").innerText=income;
document.getElementById("expense").innerText=expense;
document.getElementById("save").innerText=save;
let balance=income-expense-save;
document.getElementById("balance").innerText=balance;

let percent=goal>0 ? (save/goal)*100:0;
if(percent>100) percent=100;
document.getElementById("progress").style.width=percent+"%";
document.getElementById("goalText").innerText=`Progression: ${Math.round(percent)}%`;

let msg="👍 Bonne gestion";
if(expense>income) msg="⚠️ Dépenses > revenus";
if(percent>=100) msg="🎉 Objectif atteint !";
document.getElementById("alert").innerText=msg;

// 🔹 Widget mise à jour
document.getElementById("w_balance").innerText=balance+" DT";
document.getElementById("w_save").innerText=save+" DT";
document.getElementById("w_goal").innerText=goal+" DT";
if(data.length>0){
let last=data[data.length-1];
document.getElementById("w_last").innerText=`${last.category} - ${last.amount} DT`;
}else{
document.getElementById("w_last").innerText="Aucune";
}

generateSuggestions(income,expense,save);
}

// 🔹 Suggestions intelligentes
function generateSuggestions(income,expense,save){
let suggestions=[];
if(data.length==0){
suggestions.push("Aucune transaction pour l'instant.");
} else {
let lastTrans=data[data.length-1];
if(lastTrans.amount>0.3*(income-expense-save)){
suggestions.push(`⚠️ Attention, la dernière transaction (${lastTrans.category}) est importante !`);
}

if(goal>0 && save<goal*0.5){
let reste=Math.round(goal-save);
suggestions.push(`💡 Il est conseillé d'épargner encore ${reste} DT pour atteindre votre objectif.`);
}

let categoriesCount={};
data.forEach(d=>{
categoriesCount[d.category]=(categoriesCount[d.category]||0)+d.amount;
});
let maxCat=Object.keys(categoriesCount).reduce((a,b)=>categoriesCount[a]>categoriesCount[b]?a:b,"");
suggestions.push(`📊 Catégorie la plus dépensée : ${maxCat} (${categoriesCount[maxCat]} DT)`);

let lastDate=lastTrans.dateTime;
suggestions.push(`🕒 Dernière transaction : ${lastTrans.category} - ${lastTrans.amount} DT (${lastDate})`);
}

let ul=document.getElementById("suggestionsList");
ul.innerHTML="";
suggestions.forEach(s=>{let li=document.createElement("li"); li.innerText=s; ul.appendChild(li);});
}

function editTransaction(i){
let t=data[i];
document.getElementById("type").value=t.type;
document.getElementById("category").value=t.category;
document.getElementById("amount").value=t.amount;
document.getElementById("note").value=t.note;
editingIndex=i;
}

function deleteTransaction(i){
if(confirm("Supprimer cette transaction ?")){
data.splice(i,1);
localStorage.setItem("budgetWidget",JSON.stringify(data));
display();
}
}

display();
</script>
</body>
</html>
