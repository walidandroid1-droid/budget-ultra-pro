<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilotage Budget Agile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="glass rounded-2xl p-6 shadow-xl">
                <p class="text-gray-500 text-sm uppercase font-bold">Revenu Dispo</p>
                <h2 id="total-dispo" class="text-3xl font-black text-indigo-600">0 €</h2>
            </div>
            <div class="glass rounded-2xl p-6 shadow-xl border-l-4 border-green-500">
                <p class="text-gray-500 text-sm uppercase font-bold">Épargne Accumulée</p>
                <h2 id="total-epargne" class="text-3xl font-black text-green-600">0 €</h2>
            </div>
            <div class="glass rounded-2xl p-6 shadow-xl border-l-4 border-orange-500">
                <p class="text-gray-500 text-sm uppercase font-bold">Semaine Actuelle</p>
                <h2 id="label-semaine" class="text-3xl font-black text-orange-600">S1</h2>
            </div>
        </div>

        <div id="step-config" class="glass rounded-3xl p-8 shadow-2xl mb-8">
            <h3 class="text-xl font-bold mb-6 flex items-center">
                <i class="fas fa-sliders-h mr-3 text-indigo-500"></i> Configuration Initiale
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Revenus nets</label>
                    <input type="number" id="input-revenu" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="ex: 2500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Charges Fixes (Loyer...)</label>
                    <input type="number" id="input-charges" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="ex: 1200">
                </div>
                <div class="flex items-end">
                    <button onclick="initialiserBudget()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">
                        Calculer les Enveloppes
                    </button>
                </div>
            </div>
        </div>

        <div id="step-suivi" class="hidden glass rounded-3xl p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-bold text-gray-800">Suivi <span id="current-s-title">S1</span></h3>
                <div class="px-4 py-2 bg-indigo-100 text-indigo-700 rounded-full font-bold">
                    Budget hebdo de base : <span id="base-hebdo">0</span> €
                </div>
            </div>

            <div class="text-center mb-10">
                <p class="text-gray-500 mb-2 uppercase tracking-widest text-sm">Reste en main pour la semaine</p>
                <h1 id="reste-hebdo" class="text-7xl font-black text-indigo-900">0 €</h1>
            </div>

            <div class="flex gap-4 mb-10">
                <input type="number" id="input-depense" class="flex-1 p-4 border-2 border-indigo-200 rounded-2xl text-xl outline-none focus:border-indigo-500" placeholder="Montant dépense">
                <button onclick="ajouterDepense()" class="px-8 bg-indigo-600 text-white rounded-2xl font-bold hover:scale-105 transition-transform">
                    Soustraire
                </button>
            </div>

            <div id="cloture-actions" class="border-t pt-8">
                <p class="font-bold text-gray-700 mb-4">Fin de semaine ?</p>
                <div id="if-positive" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="cloturerSemaine('epargne')" class="p-4 bg-green-100 text-green-700 border-2 border-green-200 rounded-2xl hover:bg-green-200 transition text-left">
                        <i class="fas fa-piggy-bank mb-2 text-2xl"></i><br>
                        <span class="font-bold uppercase text-xs text-green-600">Option 1</span><br>
                        Transférer vers l'épargne
                    </button>
                    <button onclick="cloturerSemaine('report')" class="p-4 bg-blue-100 text-blue-700 border-2 border-blue-200 rounded-2xl hover:bg-blue-200 transition text-left">
                        <i class="fas fa-arrow-right mb-2 text-2xl"></i><br>
                        <span class="font-bold uppercase text-xs text-blue-600">Option 2</span><br>
                        Ajouter à la semaine suivante
                    </button>
                </div>
                <div id="if-negative" class="hidden text-center p-6 bg-orange-50 border-2 border-orange-200 rounded-2xl text-orange-800">
                    <i class="fas fa-exclamation-triangle text-3xl mb-3"></i>
                    <p class="font-bold">Vous avez dépassé votre budget !</p>
                    <p class="text-sm mb-4">Le déficit sera automatiquement déduit de la semaine suivante.</p>
                    <button onclick="cloturerSemaine('emprunt')" class="px-6 py-2 bg-orange-600 text-white rounded-xl font-bold">
                        Clôturer et Emprunter sur S+1
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            revenu: 0,
            charges: 0,
            epargneTotale: 0,
            currentWeek: 1,
            budgetHebdoBase: 0,
            resteSemaine: 0,
            reportSuivant: 0
        };

        function initialiserBudget() {
            state.revenu = parseFloat(document.getElementById('input-revenu').value) || 0;
            state.charges = parseFloat(document.getElementById('input-charges').value) || 0;
            
            let resteAVivre = state.revenu - state.charges;
            state.budgetHebdoBase = resteAVivre / 4;
            state.resteSemaine = state.budgetHebdoBase;

            document.getElementById('total-dispo').innerText = resteAVivre + " €";
            document.getElementById('step-config').classList.add('hidden');
            document.getElementById('step-suivi').classList.remove('hidden');
            updateUI();
        }

        function ajouterDepense() {
            const val = parseFloat(document.getElementById('input-depense').value) || 0;
            state.resteSemaine -= val;
            document.getElementById('input-depense').value = "";
            updateUI();
        }

        function updateUI() {
            document.getElementById('reste-hebdo').innerText = state.resteSemaine.toFixed(2) + " €";
            document.getElementById('base-hebdo').innerText = state.budgetHebdoBase.toFixed(2);
            document.getElementById('total-epargne').innerText = state.epargneTotale.toFixed(2) + " €";
            document.getElementById('current-s-title').innerText = "S" + state.currentWeek;
            document.getElementById('label-semaine').innerText = "S" + state.currentWeek;

            // Gestion des couleurs
            if (state.resteSemaine < 0) {
                document.getElementById('reste-hebdo').className = "text-7xl font-black text-orange-600";
                document.getElementById('if-negative').classList.remove('hidden');
                document.getElementById('if-positive').classList.add('hidden');
            } else {
                document.getElementById('reste-hebdo').className = "text-7xl font-black text-indigo-900";
                document.getElementById('if-negative').classList.add('hidden');
                document.getElementById('if-positive').classList.remove('hidden');
            }
        }

        function cloturerSemaine(mode) {
            if (mode === 'epargne') {
                state.epargneTotale += state.resteSemaine;
                state.reportSuivant = 0;
            } else if (mode === 'report') {
                state.reportSuivant = state.resteSemaine;
            } else if (mode === 'emprunt') {
                state.reportSuivant = state.resteSemaine; // négatif
            }

            if (state.currentWeek < 4) {
                state.currentWeek++;
                state.resteSemaine = state.budgetHebdoBase + state.reportSuivant;
                state.reportSuivant = 0;
                alert("Passage à la semaine " + state.currentWeek);
                updateUI();
            } else {
                alert("Mois terminé ! Bilan : Epargne finale = " + state.epargneTotale.toFixed(2) + "€");
                location.reload(); // Reset pour l'exemple
            }
        }
    </script>
</body>
</html>
