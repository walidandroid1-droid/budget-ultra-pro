<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Budget Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont;
background:linear-gradient(135deg,#34c759,#5ac8fa);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.widget{
width:300px;
padding:15px;
border-radius:25px;
background:rgba(0,0,0,0.25);
backdrop-filter:blur(10px);
box-shadow:0 4px 15px rgba(0,0,0,0.3);
}
h2{text-align:center;margin:5px 0;}
.line{display:flex;justify-content:space-between;margin:6px 0;}
.progress{
background:rgba(255,255,255,0.3);
border-radius:10px;
overflow:hidden;
height:12px;
}
.bar{
background:white;
height:100%;
width:0%;
}
.small{font-size:13px;text-align:center;margin-top:5px;}
</style>
</head>
<body>

<div class="widget">
<h2>💰 Budget</h2>
<div class="line"><span>Solde</span><b id="balance">0</b></div>
<div class="line"><span>Épargne</span><b id="save">0</b></div>
<div class="line"><span>Objectif</span><b id="goal">0</b></div>

<div class="progress"><div class="bar" id="bar"></div></div>
<div class="small" id="percent">0%</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("budgetV2"))||[];
let goal=localStorage.getItem("goal")||0;

let income=0,expense=0,save=0;

data.forEach(d=>{
if(d.type=="income") income+=d.amount;
if(d.type=="expense") expense+=d.amount;
if(d.type=="save") save+=d.amount;
});

let balance=income-expense-save;
document.getElementById("balance").innerText=balance+" DT";
document.getElementById("save").innerText=save+" DT";
document.getElementById("goal").innerText=goal+" DT";

let percent= goal>0 ? (save/goal)*100 : 0;
if(percent>100) percent=100;
document.getElementById("bar").style.width=percent+"%";
document.getElementById("percent").innerText=Math.round(percent)+"%";
</script>

</body>
</html>
