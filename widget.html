<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Budget Widget V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@media (prefers-color-scheme: dark){
body{background:#000;color:#fff;}
.card{background:#1c1c1e;}
}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont;
background:#f2f2f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.card{
background:#fff;
border-radius:25px;
padding:15px;
width:320px;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.small{width:180px;}
.medium{width:280px;}
.large{width:340px;}
.line{display:flex;justify-content:space-between;margin:5px 0;}
.progress{background:#ddd;border-radius:10px;overflow:hidden;height:12px;}
.bar{background:#34c759;height:100%;width:0%;}
h2{text-align:center;margin:5px 0;}
</style>
</head>
<body>

<div class="card medium" id="widget">
<h2>💰 Budget</h2>
<div class="line"><span>Solde</span><b id="balance">0</b></div>
<div class="line"><span>Épargne</span><b id="save">0</b></div>
<div class="line"><span>Objectif</span><b id="goal">0</b></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="percent" style="text-align:center">0%</p>
</div>

<script>
let data=JSON.parse(localStorage.getItem("budgetV2"))||[];
let goal=localStorage.getItem("goal")||0;

let income=0,expense=0,save=0;

data.forEach(d=>{
if(d.type=="income") income+=d.amount;
if(d.type=="expense") expense+=d.amount;
if(d.type=="save") save+=d.amount;
});

let balance=income-expense-save;
document.getElementById("balance").innerText=balance+" DT";
document.getElementById("save").innerText=save+" DT";
document.getElementById("goal").innerText=goal+" DT";

let percent= goal>0 ? (save/goal)*100 : 0;
if(percent>100) percent=100;
document.getElementById("bar").style.width=percent+"%";
document.getElementById("percent").innerText=Math.round(percent)+"%";
</script>

</body>
</html>
