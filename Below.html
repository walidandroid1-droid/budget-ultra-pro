<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Budget Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-elevated: #2c2c2e;
            --primary: #0a84ff;
            --success: #30d158;
            --warning: #ff9f0a;
            --danger: #ff453a;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --separator: #38383a;
            --safe-top: env(safe-area-inset-top, 47px);
            --safe-bottom: env(safe-area-inset-bottom, 34px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .app {
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--safe-bottom) + 100px);
        }

        .nav-header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            padding: 12px 20px;
            border-bottom: 0.5px solid var(--separator);
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }

        .month-selector {
            text-align: center;
            color: var(--primary);
            font-size: 15px;
            margin-top: 4px;
            cursor: pointer;
        }

        /* Hero */
        .hero {
            padding: 20px;
            background: linear-gradient(180deg, rgba(10,132,255,0.1) 0%, transparent 100%);
        }

        .hero-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
        }

        .balance {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .balance-label {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 4px;
        }

        .hero-stats {
            display: flex;
            gap: 24px;
            margin-top: 20px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
        }

        .stat-value.positive { color: var(--success); }
        .stat-value.negative { color: var(--danger); }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Semaines */
        .weeks-section {
            margin-top: 20px;
            padding: 0 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .week-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .week-title {
            font-size: 18px;
            font-weight: 600;
        }

        .week-badge {
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--surface-elevated);
            color: var(--text-secondary);
        }

        .week-badge.active {
            background: rgba(10,132,255,0.2);
            color: var(--primary);
        }

        /* Enveloppes */
        .envelopes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .envelope {
            background: var(--surface-elevated);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
            overflow: hidden;
        }

        .envelope:active {
            transform: scale(0.96);
        }

        .envelope.over {
            border: 1px solid var(--danger);
        }

        .envelope-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .envelope-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .envelope-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .envelope-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .envelope-fill.green { background: var(--success); }
        .envelope-fill.orange { background: var(--warning); }
        .envelope-fill.red { background: var(--danger); }

        .envelope-amount {
            font-size: 19px;
            font-weight: 700;
        }

        .envelope-amount.over {
            color: var(--danger);
        }

        .envelope-total {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Modal iOS natif style */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1001;
        }

        .modal-overlay.active + .modal-sheet {
            transform: translateY(0);
        }

        .modal-handle {
            width: 40px;
            height: 5px;
            background: var(--text-secondary);
            border-radius: 3px;
            margin: 0 auto 20px;
            opacity: 0.5;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Input iOS natif */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .ios-input {
            width: 100%;
            padding: 16px;
            background: var(--surface-elevated);
            border: 1px solid var(--separator);
            border-radius: 12px;
            color: var(--text);
            font-size: 17px;
            -webkit-appearance: none;
        }

        .ios-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .amount-input {
            font-size: 40px !important;
            font-weight: 300;
            text-align: center;
            letter-spacing: -1px;
        }

        /* Pills sélection */
        .pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .pill {
            padding: 10px 20px;
            background: var(--surface-elevated);
            border: 1px solid var(--separator);
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill.selected {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Boutons action */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--surface-elevated);
            color: var(--text);
        }

        .btn:active {
            opacity: 0.8;
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(10,132,255,0.4);
            cursor: pointer;
            z-index: 50;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: calc(60px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--surface);
            color: var(--text);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
            font-weight: 500;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="nav-header">
            <div class="nav-title">Budget Flow</div>
            <div class="month-selector" onclick="editConfig()">Janvier 2024 ⌄</div>
        </div>

        <!-- Hero -->
        <div class="hero">
            <div class="hero-card">
                <div class="balance" id="hero-balance">0€</div>
                <div class="balance-label">Reste ce mois</div>
                
                <div class="hero-stats">
                    <div class="stat">
                        <div class="stat-value positive" id="stat-income">+0€</div>
                        <div class="stat-label">Revenu</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value negative" id="stat-spent">-0€</div>
                        <div class="stat-label">Dépensé</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-saved">0€</div>
                        <div class="stat-label">Épargne</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Semaines -->
        <div class="weeks-section" id="weeks-container">
            <!-- Généré dynamiquement -->
        </div>
    </div>

    <!-- FAB Clôture -->
    <button class="fab" onclick="closeMonth()">🔒</button>

    <!-- Modal Dépense -->
    <div class="modal-overlay" id="expense-modal" onclick="closeModal('expense')"></div>
    <div class="modal-sheet" id="expense-sheet">
        <div class="modal-handle"></div>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 48px; margin-bottom: 8px;" id="modal-icon">🛒</div>
            <div style="font-size: 20px; font-weight: 600;" id="modal-envelope-name">Courses</div>
            <div style="color: var(--text-secondary); font-size: 15px; margin-top: 4px;">
                Semaine <span id="modal-week-num">1</span> · 
                <span id="modal-remaining">150€</span> dispo
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Montant</label>
            <input type="number" 
                   class="ios-input amount-input" 
                   id="expense-amount" 
                   placeholder="0" 
                   step="0.01"
                   inputmode="decimal"
                   autocomplete="off">
        </div>

        <div class="input-group">
            <label class="input-label">Description (optionnel)</label>
            <input type="text" 
                   class="ios-input" 
                   id="expense-desc" 
                   placeholder="Ex: Courses Lidl">
        </div>

        <div class="input-group">
            <label class="input-label">Qui a payé ?</label>
            <div class="pills" id="payer-pills">
                <div class="pill" onclick="selectPayer(this, '👨')">👨 Lui</div>
                <div class="pill" onclick="selectPayer(this, '👩')">👩 Elle</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="closeModal('expense')">Annuler</button>
            <button class="btn btn-primary" onclick="saveExpense()">Valider</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">Message</div>

    <script>
        const state = {
            config: {
                income: 2500,
                credit: 0,
                savingsStart: 0,
                goal: 200,
                month: new Date().toISOString().slice(0, 7)
            },
            envelopes: [
                { id: 1, name: 'Courses', icon: '🛒' },
                { id: 2, name: 'Transport', icon: '⛽' },
                { id: 3, name: 'Enfants', icon: '👶' },
                { id: 4, name: 'Loisirs', icon: '🎮' },
                { id: 5, name: 'Divers', icon: '📦' }
            ],
            weeks: [],
            currentExpense: { week: 0, envelope: 0, payer: null }
        };

        function init() {
            const weeklyTotal = (state.config.income - state.config.credit - state.config.goal) / 4;
            const perEnvelope = weeklyTotal / state.envelopes.length;

            state.weeks = Array(4).fill(null).map((_, i) => ({
                number: i + 1,
                envelopes: state.envelopes.map(e => ({
                    ...e,
                    budget: perEnvelope,
                    spent: 0,
                    transactions: []
                }))
            }));

            render();
            loadStorage();
        }

        function render() {
            updateHero();
            renderWeeks();
        }

        function updateHero() {
            const totalBudget = state.config.income - state.config.credit - state.config.goal;
            const totalSpent = state.weeks.reduce((sum, w) => 
                sum + w.envelopes.reduce((eSum, e) => eSum + e.spent, 0), 0);
            const remaining = totalBudget - totalSpent;

            document.getElementById('hero-balance').textContent = remaining.toFixed(0) + '€';
            document.getElementById('hero-balance').style.color = remaining >= 0 ? 'var(--success)' : 'var(--danger)';
            
            document.getElementById('stat-income').textContent = '+' + state.config.income + '€';
            document.getElementById('stat-spent').textContent = '-' + totalSpent.toFixed(0) + '€';
            
            const saved = state.config.savingsStart + (remaining < 0 ? 0 : state.config.goal);
            document.getElementById('stat-saved').textContent = saved.toFixed(0) + '€';
        }

        function renderWeeks() {
            const container = document.getElementById('weeks-container');
            
            container.innerHTML = state.weeks.map((week, wIdx) => `
                <div class="week-card">
                    <div class="week-header">
                        <div class="week-title">Semaine ${week.number}</div>
                        <div class="week-badge ${wIdx === 0 ? 'active' : ''}">${wIdx === 0 ? 'Cette semaine' : 'À venir'}</div>
                    </div>
                    <div class="envelopes-grid">
                        ${week.envelopes.map((env, eIdx) => {
                            const remaining = env.budget - env.spent;
                            const percent = Math.max(0, (remaining / env.budget) * 100);
                            const colorClass = percent > 50 ? 'green' : percent > 20 ? 'orange' : 'red';
                            const isOver = remaining < 0;
                            
                            return `
                                <div class="envelope ${isOver ? 'over' : ''}" onclick="openExpenseModal(${wIdx}, ${eIdx})">
                                    <div class="envelope-icon">${env.icon}</div>
                                    <div class="envelope-name">${env.name}</div>
                                    <div class="envelope-bar">
                                        <div class="envelope-fill ${colorClass}" style="width: ${Math.min(100, percent)}%"></div>
                                    </div>
                                    <div class="envelope-amount ${isOver ? 'over' : ''}">${remaining.toFixed(0)}€</div>
                                    <div class="envelope-total">/ ${env.budget.toFixed(0)}€</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openExpenseModal(weekIdx, envIdx) {
            const week = state.weeks[weekIdx];
            const env = week.envelopes[envIdx];
            const remaining = env.budget - env.spent;

            state.currentExpense = { week: weekIdx, envelope: envIdx, payer: null };
            
            document.getElementById('modal-icon').textContent = env.icon;
            document.getElementById('modal-envelope-name').textContent = env.name;
            document.getElementById('modal-week-num').textContent = week.number;
            document.getElementById('modal-remaining').textContent = remaining.toFixed(0) + '€';
            document.getElementById('modal-remaining').style.color = remaining >= 0 ? 'var(--success)' : 'var(--danger)';
            
            document.getElementById('expense-amount').value = '';
            document.getElementById('expense-desc').value = '';
            
            document.querySelectorAll('#payer-pills .pill').forEach(p => p.classList.remove('selected'));
            
            openModal('expense');
            
            // Focus sur le montant après animation
            setTimeout(() => {
                document.getElementById('expense-amount').focus();
            }, 300);
        }

        function selectPill(el, value) {
            el.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
            el.classList.add('selected');
            state.currentExpense.payer = value;
        }

        function selectPayer(el, value) {
            selectPill(el, value);
        }

        function saveExpense() {
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const desc = document.getElementById('expense-desc').value.trim();
            
            if (!amount || amount <= 0) {
                showToast('❌ Entrez un montant');
                return;
            }
            
            if (!state.currentExpense.payer) {
                showToast('❌ Sélectionnez qui a payé');
                return;
            }

            const week = state.weeks[state.currentExpense.week];
            const env = week.envelopes[state.currentExpense.envelope];
            
            env.spent += amount;
            env.transactions.push({
                amount: -amount,
                desc: desc || 'Dépense',
                payer: state.currentExpense.payer,
                date: new Date()
            });

            // Vérifier dépassement et proposer emprunt
            const remaining = env.budget - env.spent;
            if (remaining < 0 && state.currentExpense.week < 3) {
                closeModal('expense');
                setTimeout(() => proposeBorrow(state.currentExpense.week, state.currentExpense.envelope), 300);
            } else {
                closeModal('expense');
                showToast('✅ Dépense ajoutée');
            }

            render();
            saveStorage();
        }

        function proposeBorrow(weekIdx, envIdx) {
            const week = state.weeks[weekIdx];
            const env = week.envelopes[envIdx];
            const missing = Math.abs(env.budget - env.spent);
            const nextWeek = state.weeks[weekIdx + 1];
            const nextEnv = nextWeek.envelopes[envIdx];
            const availableNext = nextEnv.budget - nextEnv.spent;

            if (availableNext <= 0) {
                showToast('❌ S+1 vide, impossible d\'emprunter');
                return;
            }

            const canBorrow = Math.min(missing, availableNext);
            
            if (confirm(`${env.icon} ${env.name}\nManque: ${missing.toFixed(2)}€\n\nEmprunter ${canBorrow.toFixed(2)}€ de la semaine ${weekIdx + 2} ?`)) {
                // Effectuer l'emprunt
                nextEnv.budget -= canBorrow;
                env.budget += canBorrow;
                
                // Ajuster le spent pour compenser
                env.spent -= canBorrow;
                
                // Transaction d'emprunt
                env.transactions.push({
                    amount: canBorrow,
                    desc: `Emprunt S${weekIdx + 2}`,
                    payer: '🔄',
                    date: new Date()
                });

                showToast('✅ Emprunt effectué');
                render();
                saveStorage();
            }
        }

        function openModal(name) {
            document.getElementById(`${name}-modal`).classList.add('active');
        }

        function closeModal(name) {
            document.getElementById(`${name}-modal`).classList.remove('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function editConfig() {
            const income = prompt('Revenu du mois:', state.config.income);
            if (income === null) return;
            
            state.config.income = parseFloat(income) || 0;
            init();
            saveStorage();
        }

        function closeMonth() {
            const totalSpent = state.weeks.reduce((sum, w) => 
                sum + w.envelopes.reduce((eSum, e) => eSum + e.spent, 0), 0);
            const totalBudget = state.config.income - state.config.credit - state.config.goal;
            
            alert(`📊 Bilan du mois\n\n` +
                  `Revenus: ${state.config.income}€\n` +
                  `Dépensé: ${totalSpent.toFixed(2)}€\n` +
                  `Budget: ${totalBudget}€\n` +
                  `Différence: ${(totalBudget - totalSpent).toFixed(2)}€\n\n` +
                  `💾 Export CSV disponible`);
        }

        // Storage
        function saveStorage() {
            localStorage.setItem('budget_flow_data', JSON.stringify(state));
        }

        function loadStorage() {
            const saved = localStorage.getItem('budget_flow_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.assign(state, parsed);
                render();
            }
        }

        // Init
        init();
    </script>
</body>
</html>
